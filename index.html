<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prisma Schema Refactor</title>
<meta name="description" content="Before and after of one run of the refactor-prisma-db Claude skill on a fictional 122-model database, with the reason for every change.">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%233b5bdb%22/%3E%3C/svg%3E">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Prisma schema refactor</h1>
    <p class="sub">Before and after of a fictional 122-model PostgreSQL database, refactored by the <code>refactor-prisma-db</code> Claude skill. Both databases run in your browser via PGlite.</p>
  </div>
  <div id="dbstatus" class="dbstatus" role="status">Loading…</div>
</header>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
  <button role="tab" data-tab="models">Models</button>
  <button role="tab" data-tab="decisions">Decisions</button>
  <button role="tab" data-tab="sql">Query</button>
</nav>
<main>
  <section id="tab-overview" class="tab"></section>
  <section id="tab-models" class="tab" hidden>
    <div class="split">
      <aside class="list">
        <input id="filter" type="search" placeholder="Filter models or rules (e.g. R5)" aria-label="Filter models">
        <label class="toggle"><input id="showUnchanged" type="checkbox"> show unchanged</label>
        <div id="modelList"></div>
      </aside>
      <article id="detail" class="detail"></article>
    </div>
  </section>
  <section id="tab-decisions" class="tab" hidden></section>
  <section id="tab-sql" class="tab" hidden>
    <div class="console">
      <div class="row">
        <label>Database
          <select id="qdb"><option value="after">after (migrated)</option><option value="before">before (messy)</option></select>
        </label>
        <button id="qrun" class="primary">Run</button>
      </div>
      <textarea id="qtext" spellcheck="false" rows="5">SELECT "sourceModel", reason, count(*) FROM quarantined_row GROUP BY 1, 2 ORDER BY 1;</textarea>
      <div id="qout" class="qout"></div>
    </div>
  </section>
</main>
<footer class="foot">
  Fixtures are generated and fictional. Source: <a href="https://github.com/SchlexanderOlz/prisma-schema-refactor">SchlexanderOlz/prisma-schema-refactor</a>.
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
