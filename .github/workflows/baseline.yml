name: baseline

# After a PR is merged, store its latest successful claude-check report as the new baseline
# on the unprotected `metrics` branch. Regression checks compare against it as long as the
# harness (tests/ + fixtures/) is unchanged (harnessHash).

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  baseline:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Find the latest successful claude-check run for the merged head
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          id=$(gh run list --repo "$REPO" --workflow claude-check.yml --commit "$HEAD_SHA" --status success --limit 20 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$id" ]; then echo "::warning::no successful claude-check run for $HEAD_SHA; baseline unchanged"; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Download its report
        if: steps.find.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh run download "${{ steps.find.outputs.id }}" --repo "$REPO" --name report --dir report
      - name: Check out the metrics branch
        if: steps.find.outputs.id != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: metrics
          path: metrics
      - name: Commit baseline.json
        if: steps.find.outputs.id != ''
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("report/report.json", "utf8"));
            r.pr = Number(process.env.PR);
            r.mergeCommit = process.env.SHA;
            fs.writeFileSync("metrics/baseline.json", JSON.stringify(r, null, 2) + "\n");
          '
          cd metrics
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline.json
          git commit -m "baseline from PR #$PR (harness $(node -p 'require("./baseline.json").harnessHash.slice(0,12)'))" || { echo "baseline unchanged"; exit 0; }
          git push origin HEAD:metrics
